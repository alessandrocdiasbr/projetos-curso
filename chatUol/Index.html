<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">

    <title>Bate Papo UOL</title>
</head>
<body>

    <header class="header">
        <div class="image">
            <img src="image/logo1.png" alt="logo do bate-papo uol">
        </div>
        <div class="icon">
            <button class="participants-btn" onclick="toggleParticipantsPanel()">
                <ion-icon name="people-sharp" id="menu-icon"></ion-icon>
            </button>
        </div>
    </header>

    <main>
        <div class="container" id="messages"></div>
    </main>

    <div class="participants-panel" id="participants-panel">
        <div class="contact-message">
            <h2>Escolha um contato para enviar mensagem:</h2>
            <div class="contact-option" onclick="selectRecipient('Todos')">
                <div class="contact-info">
                    <ion-icon name="people-sharp"></ion-icon>
                    <span>Todos</span>
                </div>
                <ion-icon name="checkmark-sharp" class="check-icon"></ion-icon>
            </div>
            <ul id="participants">
            </ul>
        </div>
        <div class="contact-visibily">
            <h2>Escolha a visibilidade</h2>
            <div class="visibility-option" onclick="setMessageType('public')">
                <div class="visibility-info">
                    <ion-icon name="lock-open-sharp"></ion-icon>
                    <span>Público</span>
                </div>
                <ion-icon name="checkmark-sharp" class="check-icon"></ion-icon>
            </div>
            <div class="visibility-option" onclick="setMessageType('private')">
                <div class="visibility-info">
                    <ion-icon name="lock-closed-sharp"></ion-icon>
                    <span>Reservadamente</span>
                </div>
                <ion-icon name="checkmark-sharp" class="check-icon"></ion-icon>
            </div>
        </div>
    </div>


    

    <script src="javascript/script.js"></script>
</body>
</html>
